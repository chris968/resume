name: Deploy to surge.sh

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build static content
      run: |
        mkdir out
        nix build
        cp result/resume/resume.html out/${{ github.actor}}_resume.html
        cp result/resume/resume.pdf out/${{ github.actor}}_resume.pdf
        cp result/resume/resume.md out/${{ github.actor}}_resume.md

    - name: Stage
      run: |
        mkdir public
        cp out/${{ github.actor }}_resume.html public/index.html

    - name: Publish static content
      run: |
        npm install --global surge
        npx surge ./public https://resume.c-aubry.be
      env:
        SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

    - name: Set tag
      id: current-datetime
      run: echo "CURRENT_DATETIME=$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"

    - name: Build release
      shell: bash
      run: |
        gh release create ${{ steps.current-datetime.outputs.CURRENT_DATETIME }} \
        -n ${{ steps.current-datetime.outputs.CURRENT_DATETIME }} \
        out/${{ github.actor }}_resume.html \
        out/${{ github.actor }}_resume.md \
        out/${{ github.actor }}_resume.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
